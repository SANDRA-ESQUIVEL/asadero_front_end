<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal</title>
    <link rel="stylesheet" href="/css/style_menu.css">
</head>
<body>

        <div class="titulo_asadero">
            <h1>The Broaster House - <span id="rolPrincipal"></span></h1>         
        </div>

    <header>
        <div>
            <img src="/img/logobroasterhouse.png" class="logo_arriba">
            <img src="/img/logobroasterhouse.png" class="logo_arriba">
            <img src="/img/logobroasterhouse.png" class="logo_arriba">
        </div>
    </header>

<main>
        <aside class="sidebar">
            <div class="user-info" id="infoUsuario">
                
            </div>

            <div class="menu">
                <button class="menu-item" onclick="toggleSubmenu('usuarios')">Gestión de Usuarios</button>
                <div class="submenu" id="usuarios">
                    <button onclick="abrirModal('modalCrearUsuario1')">Crear Usuario</button>
                    <button onclick="abrirModal('modalModificar1')">Modificar Usuario</button>
                    <button onclick="abrirModal('modalEliminar')">Eliminar Usuario</button>
                    <button onclick="abrirModal('modalDesactivar')">Desactivar Usuario</button>
                </div>
    
                <button class="menu-item" onclick="toggleSubmenu('ventas')">Gestión Ventas</button>
                <div class="submenu" id="ventas">
                    <button onclick="abrirModal('modalRegistrarVenta')">Registrar Venta</button>
                    <button onclick="abrirModal('modalHistorialVentas')">Historial de Ventas</button>
                    <button onclick="abrirModal('modalVentasDia')">Ventas del Día</button>
                    <button onclick="abrirModal('modalConsultaVentas')">Consulta de Ventas</button>
                </div>
    
                <button class="menu-item" onclick="toggleSubmenu('inventario')">Gestión Inventario</button>
                <div class="submenu" id="inventario">
                    <button onclick="abrirModal('modalRegistroProducto')">Registro de Producto</button>
                    <button onclick="abrirModal('modalActualizarInventario')">Actualizar Inventario</button>
                    <button onclick="abrirModal('modalConsultarInventario')">Consultar Inventario</button>
                    <button onclick="abrirModal('modalAlertas')">Alertas</button>
                    <button onclick="abrirModal('modalActualizarStock')">Actualizar stock</button>
                    <button onclick="abrirModal('modalReportes')">Reportes</button>
                </div>
                    
                <button class="menu-itemcerrar" onclick="cerrarSesion('cerrar')">Cerrar Sesión</button>

            </div>
        </aside>
    
    </main>

        <footer>
            <p>© 2025 Elaborado por Sandra Esquivel - ADSO- 3070230</p>
        </footer>

    <script src="/js/script.menu.js"></script>
</body>
</html>
